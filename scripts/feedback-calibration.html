<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petrarca — Algorithm Calibration</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Crimson+Pro:wght@400;500&family=DM+Sans:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f7f4ec;
    color: #2a2420;
    font-family: 'Crimson Pro', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    width: 100%;
    max-width: 640px;
    padding: 24px 16px 0;
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    color: #2a2420;
    margin-bottom: 2px;
  }

  .header .subtitle {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: #6a6458;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .double-rule {
    border-top: 2px solid #2a2420;
    padding-top: 5px;
    border-bottom: 1px solid #2a2420;
    height: 0;
    margin-bottom: 16px;
  }

  /* Progress bar */
  .progress-area {
    width: 100%;
    max-width: 640px;
    padding: 0 16px;
    margin-bottom: 16px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .progress-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #6a6458;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    min-width: 100px;
  }

  .progress-track {
    flex: 1;
    height: 3px;
    background: #e4dfd4;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: #8b2500;
    transition: width 0.3s ease;
    border-radius: 2px;
  }

  .progress-count {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #b0a898;
    min-width: 36px;
    text-align: right;
  }

  /* Round indicator */
  .round-indicator {
    width: 100%;
    max-width: 640px;
    padding: 0 16px;
    margin-bottom: 16px;
  }

  .round-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid #e4dfd4;
  }

  .round-tab {
    font-family: 'EB Garamond', serif;
    font-size: 13px;
    padding: 6px 16px;
    color: #b0a898;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .round-tab.active {
    color: #2a2420;
    border-bottom-color: #8b2500;
  }

  .round-tab.done {
    color: #6a6458;
  }

  .round-tab .check { color: #2a7a4a; margin-left: 4px; }

  /* Card area */
  .card-area {
    width: 100%;
    max-width: 640px;
    padding: 0 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .round-title {
    font-family: 'EB Garamond', serif;
    font-size: 14px;
    color: #8b2500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .round-title::before {
    content: '✦ ';
  }

  .round-question {
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    color: #6a6458;
    margin-bottom: 16px;
  }

  /* The card itself */
  .card {
    background: #fff;
    border: 1px solid #e4dfd4;
    border-left: 3px solid #e4dfd4;
    padding: 20px 24px;
    margin-bottom: 12px;
    transition: all 0.2s ease;
    position: relative;
  }

  .card.exit-left {
    transform: translateX(-120%);
    opacity: 0;
    transition: all 0.25s ease;
  }

  .card.exit-right {
    transform: translateX(120%);
    opacity: 0;
    transition: all 0.25s ease;
  }

  .card.exit-up {
    transform: translateY(-80%);
    opacity: 0;
    transition: all 0.25s ease;
  }

  .card .source {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #b0a898;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .card .claim-text {
    font-family: 'Crimson Pro', serif;
    font-size: 18px;
    line-height: 1.45;
    color: #2a2420;
  }

  .card .claim-type {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    color: #b0a898;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 10px;
  }

  /* Pair card */
  .pair-card {
    background: #fff;
    border: 1px solid #e4dfd4;
    padding: 0;
    margin-bottom: 12px;
    transition: all 0.2s ease;
    position: relative;
  }

  .pair-card.exit-left, .pair-card.exit-right, .pair-card.exit-up {
    opacity: 0;
    transition: all 0.25s ease;
  }
  .pair-card.exit-left { transform: translateX(-120%); }
  .pair-card.exit-right { transform: translateX(120%); }
  .pair-card.exit-up { transform: translateY(-80%); }

  .pair-half {
    padding: 16px 20px;
  }

  .pair-half:first-child {
    border-bottom: 1px solid #e4dfd4;
  }

  .pair-half .source {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    color: #b0a898;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  .pair-half .claim-text {
    font-family: 'Crimson Pro', serif;
    font-size: 16px;
    line-height: 1.4;
    color: #2a2420;
  }

  .pair-meta {
    padding: 6px 20px;
    background: #f7f4ec;
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    color: #b0a898;
    display: flex;
    justify-content: space-between;
  }

  /* Key hints */
  .key-hints {
    width: 100%;
    max-width: 640px;
    padding: 12px 16px;
    display: flex;
    justify-content: center;
    gap: 24px;
    position: sticky;
    bottom: 0;
    background: #f7f4ec;
    border-top: 1px solid #e4dfd4;
  }

  .key-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: #6a6458;
  }

  .key-hint kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: 1px solid #d0ccc0;
    border-radius: 4px;
    background: #fff;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 13px;
    color: #2a2420;
  }

  .key-hint .hint-label {
    font-size: 12px;
  }

  /* Flash feedback */
  .flash {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 600;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
  }

  .flash.show { opacity: 0.6; }
  .flash.good { color: #2a7a4a; }
  .flash.mid { color: #c9a84c; }
  .flash.bad { color: #8b2500; }

  /* Results screen */
  .results {
    width: 100%;
    max-width: 640px;
    padding: 24px 16px;
    display: none;
  }

  .results h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 20px;
    margin-bottom: 12px;
  }

  .results table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    margin-bottom: 20px;
  }

  .results th {
    text-align: left;
    font-weight: 500;
    color: #6a6458;
    padding: 6px 8px;
    border-bottom: 1px solid #e4dfd4;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .results td {
    padding: 6px 8px;
    border-bottom: 1px solid #f0ece2;
    color: #333;
  }

  .results .stat-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 600;
    color: #8b2500;
  }

  .results .stat-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #6a6458;
    text-transform: uppercase;
  }

  .stat-row {
    display: flex;
    gap: 32px;
    margin-bottom: 20px;
  }

  .json-output {
    background: #2a2420;
    color: #e4dfd4;
    padding: 16px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
    margin-top: 12px;
    cursor: pointer;
  }

  .copy-hint {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #b0a898;
    margin-top: 4px;
  }

  .analysis-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #e4dfd4;
  }

  .analysis-section h3 {
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    color: #8b2500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  .analysis-section h3::before { content: '✦ '; }

  .analysis-section p {
    font-family: 'Crimson Pro', serif;
    font-size: 14px;
    line-height: 1.5;
    color: #333;
    margin-bottom: 8px;
  }

  .threshold-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
  }

  .threshold-bar .bar {
    flex: 1;
    height: 6px;
    background: #e4dfd4;
    border-radius: 3px;
    position: relative;
  }

  .threshold-bar .marker {
    position: absolute;
    top: -3px;
    width: 2px;
    height: 12px;
    background: #8b2500;
  }

  .threshold-bar label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #6a6458;
    min-width: 60px;
  }

  .threshold-bar .value {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #2a2420;
    min-width: 40px;
    text-align: right;
  }
</style>
</head>

<div class="results" id="results"></div>

icle_id": "39fa7904ceff"}, {"claim_id": "848f9dd381f1", "text": "Luigi Pirandello accepted an offer to teach Italian at the Istituto Superiore di Magistero di Roma in 1897.", "claim_type": "factual", "article_title": "Luigi Pirandello — Biography", "article_id": "5d39ab007272"}, {"claim_id": "7c301a1d8cf7", "text": "Erulo Eroli created an Italian painting of the Sicilian Vespers between 1890 and 1891.", "claim_type": "factual", "article_title": "Sicilian Vespers: Cultural Legacy and Representations", "article_id": "cb6894653c77"}, {"claim_id": "f4c20b638977", "text": "Researchers Aruna Ranganathan and Xingqi Maggie Ye conducted an eight-month observational study on AI's impact on work habits at a 200-employee U.S. tech company.", "claim_type": "factual", "article_title": "AI Was Supposed to Free My Time. It Consumed It.", "article_id": "3ffa4c16591f"}, {"claim_id": "f7bb5af2eb8c", "text": "The Normans captured Noto in 1091, completing the conquest of Sicily.", "claim_type": "factual", "article_title": "History of Islam in Southern Italy and Sicily", "article_id": "d76933afa09d"}, {"claim_id": "7fb5afd0111b", "text": "Ellen Einan and Tor Ulven established writing practices based on French interwar surrealism, which paradoxically broke with the avant-garde requirement for constant artistic renewal.", "claim_type": "causal", "article_title": "Etter kroppsmodernismen: Norsk lyrikk og 90-tallsestetikk", "article_id": "be3d53d771fc"}, {"claim_id": "9e6a68304206", "text": "Recap DocType uses direct Loro APIs and nested Loro containers to facilitate granular CRDT tracking of dynamic data.", "claim_type": "factual", "article_title": "Recap DocType Architectural Specification and Security Review", "article_id": "75972a5d6aa1"}, {"claim_id": "8946dd74bd8c", "text": "Luigi Pirandello wrote the play *L'uomo, la bestia e la virtù*, also known as *Man, Beast and Virtue*, in 1919.", "claim_type": "factual", "article_title": "Luigi Pirandello — Selected Works", "article_id": "f7466b her Activities Beyond Protection Rackets", "topics": ["organized-crime", "sicilian-mafia", "italian-politics"]}, {"claim_id": "920a3825d56c", "text": "Ancient Greek and Byzantine Greek coexisted for a long time in diglossia with Latin in Sicily.", "claim_type": "factual", "article_title": "Sicilian Language — Vocabulary: Historical Substrates and Etymological Layers", "topics": ["sicilian-language", "historical-linguistics", "etymology"]}, {"claim_id": "a2690be74935", "text": "Supervised fine-tuning of Large Language Models requires robust safeguards against data poisoning attacks.", "claim_type": "evaluative", "article_title": "Learning to Poison Large Language Models for Downstream Manipulation", "topics": ["llm-applications", "model-architecture", "ai-safety"]}, {"claim_id": "67c3890021a9", "text": "Empedocles theorized that all humans, or maybe only a selected few among them, were originally long-lived daimons who dwelt in a state of bliss until committing an unspecified crime.", "claim_type": "factual", "article_title": "Empedocles: Life, Philosophy, and Legacy", "topics": ["pre-socratic-philosophy", "ancient-greece", "cosmogony"]}, {"claim_id": "766240753411", "text": "The emir appointed governors of major cities, high ranking judges (*qāḍī*), and arbitrators for minor disputes between individuals.", "claim_type": "factual", "article_title": "Muslim Sicily: Government, Coinage, and the End of Islamic Rule", "topics": ["medieval-history", "islamic-civilization", "sicily"]}, {"claim_id": "92c5d26978d1", "text": "Mission Control enables inter-agent messaging and comms.", "claim_type": "factual", "article_title": "Mission Control: Open-Source Dashboard for AI Agent Orchestration", "topics": ["ai-agents", "orchestration", "dashboard"]}, {"claim_id": "51428a54b2c0", "text": "Naxos is located in the Metropolitan City of Messina.", "claim_type": "factual", "article_title": "Sicily: Monuments and Places of Interest", "topics": ["sicily", "archaeology", "architecture"]}]};

const ROUNDS = [
  {
    key: 'claim_quality',
    title: 'Claim Quality',
    question: 'Is this worth extracting from the article?',
    options: [
      { key: 'j', label: 'Good', value: 'good', flash: '✓', css: 'good', exit: 'exit-right' },
      { key: 'k', label: 'Trivial', value: 'trivial', flash: '~', css: 'mid', exit: 'exit-up' },
      { key: 'l', label: 'Bad', value: 'bad', flash: '✗', css: 'bad', exit: 'exit-left' },
    ],
    renderCard: (item) => `
      <div class="card" id="current-card">
        <div class="source">${escHtml(item.article_title)}</div>
        <div class="claim-text">${escHtml(item.text)}</div>
        <div class="claim-type">${item.claim_type}</div>
      </div>
    `
  },
  {
    key: 'pair_judgment',
    title: 'Similarity Calibration',
    question: 'Are these two claims saying the same thing?',
    options: [
      { key: 'j', label: 'Same', value: 'same', flash: '=', css: 'good', exit: 'exit-right' },
      { key: 'k', label: 'Related', value: 'related', flash: '≈', css: 'mid', exit: 'exit-up' },
      { key: 'l', label: 'Different', value: 'different', flash: '≠', css: 'bad', exit: 'exit-left' },
    ],
    renderCard: (item) => `
      <div class="pair-card" id="current-card">
        <div class="pair-half">
          <div class="source">${escHtml(item.a_article)}</div>
          <div class="claim-text">${escHtml(item.a_text)}</div>
        </div>
        <div class="pair-half">
          <div class="source">${escHtml(item.b_article)}</div>
          <div class="claim-text">${escHtml(item.b_text)}</div>
        </div>
        <div class="pair-meta">
          <span>cosine: ${item.score.toFixed(3)}</span>
          <span>nli: ${item.nli}</span>
          <span>${item.zone.replace('_', ' ')}</span>
        </div>
      </div>
    `
  },
  {
    key: 'knowledge_check',
    title: 'Knowledge Ground Truth',
    question: 'Did you already know this before reading the article?',
    options: [
      { key: 'j', label: 'Knew it', value: 'known', flash: '✓', css: 'good', exit: 'exit-right' },
      { key: 'k', label: 'Vaguely', value: 'vague', flash: '~', css: 'mid', exit: 'exit-up' },
      { key: 'l', label: 'New', value: 'new', flash: '✗', css: 'bad', exit: 'exit-left' },
    ],
    renderCard: (item) => `
      <div class="card" id="current-card">
        <div class="source">${escHtml(item.article_title)}</div>
        <div class="claim-text">${escHtml(item.text)}</div>
        <div class="claim-type">${item.claim_type}${item.topics ? ' · ' + item.topics.join(', ') : ''}</div>
      </div>
    `
  }
];

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// State
let currentRound = 0;
let currentIndex = 0;
let totalAnswered = 0;
const results = { claim_quality: [], pair_judgment: [], knowledge_check: [] };
const startTime = Date.now();
let locked = false;

function totalCards() {
  return DATA.claim_quality.length + DATA.pair_judgment.length + DATA.knowledge_check.length;
}

function currentData() {
  return DATA[ROUNDS[currentRound].key];
}

function renderCard() {
  const round = ROUNDS[currentRound];
  const items = currentData();

  if (currentIndex >= items.length) {
    nextRound();
    return;
  }

  const item = items[currentIndex];
  document.getElementById('card-area').innerHTML = `
    <div class="round-title">${round.title}</div>
    <div class="round-question">${round.question}</div>
    ${round.renderCard(item)}
  `;

  // Update hints
  document.getElementById('key-hints').innerHTML = round.options.map(o =>
    `<div class="key-hint"><kbd>${o.key.toUpperCase()}</kbd><span class="hint-label">${o.label}</span></div>`
  ).join('');

  // Update tabs
  ROUNDS.forEach((r, i) => {
    const tab = document.getElementById('tab-' + i);
    tab.className = 'round-tab' + (i === currentRound ? ' active' : '') +
      (i < currentRound ? ' done' : '');
    if (i < currentRound) tab.innerHTML = r.title + '<span class="check">✓</span>';
  });

  updateProgress();
}

function updateProgress() {
  const pct = (totalAnswered / totalCards() * 100).toFixed(1);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-count').textContent = totalAnswered + '/' + totalCards();
}

function showFlash(text, css) {
  const el = document.getElementById('flash');
  el.textContent = text;
  el.className = 'flash show ' + css;
  setTimeout(() => el.className = 'flash', 200);
}

function answer(optionIndex) {
  if (locked) return;
  locked = true;

  const round = ROUNDS[currentRound];
  const option = round.options[optionIndex];
  const item = currentData()[currentIndex];

  // Record
  const entry = { ...item, judgment: option.value, time_ms: Date.now() - startTime };
  results[round.key].push(entry);

  // Animate
  showFlash(option.flash, option.css);
  const card = document.getElementById('current-card');
  if (card) card.classList.add(option.exit);

  totalAnswered++;
  currentIndex++;

  setTimeout(() => {
    locked = false;
    renderCard();
  }, 250);
}

function nextRound() {
  currentRound++;
  currentIndex = 0;
  if (currentRound >= ROUNDS.length) {
    showResults();
    return;
  }
  renderCard();
}

function showResults() {
  document.getElementById('card-area').style.display = 'none';
  document.getElementById('key-hints').style.display = 'none';
  const el = document.getElementById('results');
  el.style.display = 'block';

  const elapsed = ((Date.now() - startTime) / 1000).toFixed(0);
  const perCard = (elapsed / totalAnswered).toFixed(1);

  // Compute stats
  const cq = results.claim_quality;
  const pj = results.pair_judgment;
  const kc = results.knowledge_check;

  const cqCounts = { good: 0, trivial: 0, bad: 0 };
  cq.forEach(c => cqCounts[c.judgment]++);

  const pjCounts = { same: 0, related: 0, different: 0 };
  pj.forEach(p => pjCounts[p.judgment]++);

  const kcCounts = { known: 0, vague: 0, new: 0 };
  kc.forEach(k => kcCounts[k.judgment]++);

  // Threshold analysis
  const sameScores = pj.filter(p => p.judgment === 'same').map(p => p.score);
  const relatedScores = pj.filter(p => p.judgment === 'related').map(p => p.score);
  const diffScores = pj.filter(p => p.judgment === 'different').map(p => p.score);

  const avg = arr => arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(3) : 'n/a';
  const min = arr => arr.length ? Math.min(...arr).toFixed(3) : 'n/a';
  const max = arr => arr.length ? Math.max(...arr).toFixed(3) : 'n/a';

  // NLI accuracy
  const nliCorrect = pj.filter(p => {
    if (p.judgment === 'same' && p.nli === 'ENTAILS') return true;
    if (p.judgment === 'related' && p.nli === 'EXTENDS') return true;
    if (p.judgment === 'different' && p.nli === 'UNRELATED') return true;
    return false;
  }).length;
  const nliTotal = pj.filter(p => p.nli && p.nli !== 'none').length;

  // Claim type breakdown
  const typeJudgments = {};
  cq.forEach(c => {
    if (!typeJudgments[c.claim_type]) typeJudgments[c.claim_type] = { good: 0, trivial: 0, bad: 0 };
    typeJudgments[c.claim_type][c.judgment]++;
  });

  el.innerHTML = `
    <h2>Calibration Complete</h2>
    <div class="double-rule"></div>

    <div class="stat-row">
      <div><div class="stat-number">${totalAnswered}</div><div class="stat-label">cards rated</div></div>
      <div><div class="stat-number">${elapsed}s</div><div class="stat-label">elapsed</div></div>
      <div><div class="stat-number">${perCard}s</div><div class="stat-label">per card</div></div>
    </div>

    <div class="analysis-section">
      <h3>Round 1 — Claim Quality</h3>
      <table>
        <tr><th>Verdict</th><th>Count</th><th>%</th></tr>
        <tr><td>Good</td><td>${cqCounts.good}</td><td>${(cqCounts.good / cq.length * 100).toFixed(0)}%</td></tr>
        <tr><td>Trivial</td><td>${cqCounts.trivial}</td><td>${(cqCounts.trivial / cq.length * 100).toFixed(0)}%</td></tr>
        <tr><td>Bad</td><td>${cqCounts.bad}</td><td>${(cqCounts.bad / cq.length * 100).toFixed(0)}%</td></tr>
      </table>
      ${Object.keys(typeJudgments).length > 0 ? `
        <p style="font-size:13px; color:#6a6458;">By claim type:</p>
        <table>
          <tr><th>Type</th><th>Good</th><th>Trivial</th><th>Bad</th></tr>
          ${Object.entries(typeJudgments).map(([t, j]) =>
            `<tr><td>${t}</td><td>${j.good}</td><td>${j.trivial}</td><td>${j.bad}</td></tr>`
          ).join('')}
        </table>
      ` : ''}
    </div>

    <div class="analysis-section">
      <h3>Round 2 — Similarity Thresholds</h3>
      <table>
        <tr><th>Your verdict</th><th>Count</th><th>Avg score</th><th>Range</th></tr>
        <tr><td>Same</td><td>${pjCounts.same}</td><td>${avg(sameScores)}</td><td>${min(sameScores)} – ${max(sameScores)}</td></tr>
        <tr><td>Related</td><td>${pjCounts.related}</td><td>${avg(relatedScores)}</td><td>${min(relatedScores)} – ${max(relatedScores)}</td></tr>
        <tr><td>Different</td><td>${pjCounts.different}</td><td>${avg(diffScores)}</td><td>${min(diffScores)} – ${max(diffScores)}</td></tr>
      </table>
      <p>Current KNOWN threshold: <strong>0.880</strong> · Current EXTENDS threshold: <strong>0.720</strong></p>
      <p>Suggested KNOWN: <strong>${sameScores.length ? min(sameScores) : '?'}</strong> (min score you called "same")</p>
      <p>NLI accuracy vs your judgment: <strong>${nliTotal > 0 ? (nliCorrect / nliTotal * 100).toFixed(0) + '%' : 'n/a'}</strong> (${nliCorrect}/${nliTotal} matched)</p>
    </div>

    <div class="analysis-section">
      <h3>Round 3 — Knowledge Ground Truth</h3>
      <table>
        <tr><th>Your knowledge</th><th>Count</th><th>%</th></tr>
        <tr><td>Knew it</td><td>${kcCounts.known}</td><td>${(kcCounts.known / kc.length * 100).toFixed(0)}%</td></tr>
        <tr><td>Vaguely</td><td>${kcCounts.vague}</td><td>${(kcCounts.vague / kc.length * 100).toFixed(0)}%</td></tr>
        <tr><td>New to me</td><td>${kcCounts.new}</td><td>${(kcCounts.new / kc.length * 100).toFixed(0)}%</td></tr>
      </table>
    </div>

    <div class="analysis-section">
      <h3>Raw Results (JSON)</h3>
      <p>Click to copy, then paste back into Claude Code for analysis.</p>
      <div class="json-output" id="json-output" onclick="copyJson()">${escHtml(JSON.stringify(results, null, 2))}</div>
      <div class="copy-hint" id="copy-hint">Click to copy to clipboard</div>
    </div>
  `;
}

function copyJson() {
  navigator.clipboard.writeText(JSON.stringify(results)).then(() => {
    document.getElementById('copy-hint').textContent = 'Copied!';
  });
}

// Keyboard handler
document.addEventListener('keydown', (e) => {
  const round = ROUNDS[currentRound];
  if (!round) return;

  const idx = round.options.findIndex(o => o.key === e.key.toLowerCase());
  if (idx !== -1) {
    e.preventDefault();
    answer(idx);
  }
});

// Init
renderCard();
</script>
</body>
</html>
