<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petrarca — Claim Calibration</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f7f4ec;
    color: #2a2420;
    font-family: 'Crimson Pro', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    width: 100%;
    max-width: 680px;
    padding: 24px 16px 0;
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 22px;
    color: #2a2420;
    margin-bottom: 2px;
  }

  .header .subtitle {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: #6a6458;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .double-rule {
    border-top: 2px solid #2a2420;
    padding-top: 5px;
    border-bottom: 1px solid #2a2420;
    height: 0;
    margin-bottom: 16px;
  }

  /* Progress */
  .progress-area {
    width: 100%;
    max-width: 680px;
    padding: 0 16px;
    margin-bottom: 16px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #6a6458;
    min-width: 50px;
  }

  .progress-track {
    flex: 1;
    height: 4px;
    background: #e4dfd4;
    border-radius: 2px;
  }

  .progress-fill {
    height: 100%;
    background: #8b2500;
    border-radius: 2px;
    transition: width 0.3s;
  }

  .progress-count {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #6a6458;
    min-width: 40px;
    text-align: right;
  }

  /* Round tabs */
  .round-tabs {
    display: flex;
    gap: 0;
    width: 100%;
    max-width: 680px;
    padding: 0 16px;
    margin-bottom: 16px;
  }

  .round-tab {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: #b0a898;
    border-bottom: 2px solid #e4dfd4;
    cursor: default;
  }

  .round-tab.active {
    color: #8b2500;
    border-bottom-color: #8b2500;
  }

  .round-tab.done {
    color: #2a7a4a;
    border-bottom-color: #2a7a4a;
  }

  .round-tab .check { color: #2a7a4a; margin-left: 4px; }

  /* Card area */
  .card-area {
    width: 100%;
    max-width: 680px;
    padding: 0 16px;
    min-height: 300px;
  }

  .card {
    background: #fff;
    border: 1px solid #e4dfd4;
    border-radius: 4px;
    padding: 20px 24px;
    margin-bottom: 12px;
  }

  .card-instruction {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #8b2500;
    margin-bottom: 12px;
  }

  .claim-text {
    font-family: 'Crimson Pro', serif;
    font-size: 17px;
    line-height: 1.5;
    color: #2a2420;
    margin-bottom: 8px;
  }

  .claim-source {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #b0a898;
    margin-bottom: 4px;
  }

  .claim-type-badge {
    display: inline-block;
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    color: #6a6458;
    background: #f0ece2;
    padding: 2px 6px;
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Pair display (Round 2) */
  .pair-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .pair-item {
    border-left: 3px solid #e4dfd4;
    padding-left: 14px;
  }

  .pair-item.a { border-left-color: #8b2500; }
  .pair-item.b { border-left-color: #2a7a4a; }

  .pair-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #b0a898;
    margin-bottom: 4px;
  }

  .pair-claim {
    font-family: 'Crimson Pro', serif;
    font-size: 16px;
    line-height: 1.45;
    color: #2a2420;
    margin-bottom: 4px;
  }

  .sim-score {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    color: #b0a898;
    margin-top: 8px;
  }

  /* Article pair (Round 3) */
  .article-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .article-side h3 {
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    font-weight: 500;
    color: #2a2420;
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .article-side .summary {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-size: 13px;
    color: #6a6458;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .article-side .claim-list {
    list-style: none;
  }

  .article-side .claim-list li {
    font-family: 'Crimson Pro', serif;
    font-size: 13px;
    color: #333;
    line-height: 1.4;
    padding-left: 10px;
    border-left: 2px solid #e4dfd4;
    margin-bottom: 6px;
  }

  /* Buttons */
  .button-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1;
    min-width: 80px;
    padding: 12px 8px;
    border: 1px solid #e4dfd4;
    border-radius: 4px;
    background: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: #2a2420;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }

  .btn:hover { border-color: #8b2500; color: #8b2500; }

  .btn .key-hint {
    display: block;
    font-size: 10px;
    color: #b0a898;
    margin-top: 2px;
  }

  /* Flash */
  .flash {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 600;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
  }

  .flash.show { opacity: 0.5; }

  /* Results */
  .results {
    width: 100%;
    max-width: 680px;
    padding: 24px 16px;
    display: none;
  }

  .results h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 20px;
    margin-bottom: 16px;
  }

  .results h3 {
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    color: #8b2500;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin: 20px 0 8px;
  }

  .stat-row {
    display: flex;
    gap: 32px;
    margin-bottom: 16px;
  }

  .stat-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 600;
    color: #8b2500;
  }

  .stat-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #6a6458;
    text-transform: uppercase;
  }

  .results table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    margin-bottom: 12px;
  }

  .results th {
    text-align: left;
    font-weight: 500;
    color: #6a6458;
    padding: 6px 8px;
    border-bottom: 1px solid #e4dfd4;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .results td {
    padding: 6px 8px;
    border-bottom: 1px solid #f0ece2;
    color: #333;
  }

  .json-output {
    background: #2a2420;
    color: #e4dfd4;
    padding: 16px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 300px;
    overflow-y: auto;
    margin-top: 12px;
    cursor: pointer;
  }

  .copy-hint {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: #b0a898;
    margin-top: 4px;
  }

  .insight-box {
    background: rgba(139,37,0,0.03);
    border-left: 2px solid #8b2500;
    padding: 12px 14px;
    margin: 12px 0;
    font-family: 'Crimson Pro', serif;
    font-size: 14px;
    line-height: 1.5;
    color: #6a6458;
  }
</style>
</head>

const ROUNDS = [
  {
    key: 'round1',
    title: 'Worth tracking?',
    instruction: 'Would you want the system to track this claim across articles?',
    buttons: [
      { label: 'Insight', sub: 'Pattern / trend / idea I care about', value: 'insight', key: '1', flash: '★', flashClass: 'good' },
      { label: 'Useful fact', sub: 'Specific but worth remembering', value: 'useful', key: '2', flash: '•', flashClass: 'mid' },
      { label: 'Noise', sub: 'Too specific / obvious / don\'t care', value: 'noise', key: '3', flash: '✕', flashClass: 'bad' },
    ],
    renderCard(item) {
      return `
        <div class="claim-text">${item.text}</div>
        <div class="claim-source">from: ${item.article}</div>
        <div class="claim-type-badge">${item.type}</div>
      `;
    },
  },
  {
    key: 'round2',
    title: 'Same insight?',
    instruction: 'Are these two claims about the same underlying idea or pattern?',
    buttons: [
      { label: 'Same thing', sub: 'Basically the same insight', value: 'same', key: '1', flash: '=', flashClass: 'good' },
      { label: 'Related', sub: 'Same theme but distinct points', value: 'related', key: '2', flash: '~', flashClass: 'mid' },
      { label: 'Different', sub: 'Unrelated despite surface similarity', value: 'different', key: '3', flash: '≠', flashClass: 'bad' },
    ],
    renderCard(item) {
      return `
        <div class="pair-container">
          <div class="pair-item a">
            <div class="pair-label">Article A</div>
            <div class="pair-claim">${item.claim_a}</div>
            <div class="claim-source">${item.article_a}</div>
          </div>
          <div class="pair-item b">
            <div class="pair-label">Article B</div>
            <div class="pair-claim">${item.claim_b}</div>
            <div class="claim-source">${item.article_b}</div>
          </div>
        </div>
        <div class="sim-score">System similarity: ${item.score > 0 ? item.score.toFixed(3) : 'not detected'}</div>
      `;
    },
  },
  {
    key: 'round3',
    title: 'Article overlap?',
    instruction: 'How much would reading article A reduce the value of reading article B?',
    buttons: [
      { label: 'Significant overlap', sub: 'Reading both would feel redundant', value: 'high', key: '1', flash: '▮▮', flashClass: 'bad' },
      { label: 'Shared themes', sub: 'Same topic area, distinct content', value: 'some', key: '2', flash: '▮▯', flashClass: 'mid' },
      { label: 'No overlap', sub: 'Completely independent value', value: 'none', key: '3', flash: '▯▯', flashClass: 'good' },
    ],
    renderCard(item) {
      const claimsA = item.claims_a.map(c => `<li>${c}</li>`).join('');
      const claimsB = item.claims_b.map(c => `<li>${c}</li>`).join('');
      return `
        <div class="article-pair">
          <div class="article-side">
            <h3>${item.article_a}</h3>
            <div class="summary">${item.summary_a}</div>
            <ul class="claim-list">${claimsA}</ul>
          </div>
          <div class="article-side">
            <h3>${item.article_b}</h3>
            <div class="summary">${item.summary_b}</div>
            <ul class="claim-list">${claimsB}</ul>
          </div>
        </div>
        <div class="sim-score">System detected overlapping claims: ${item.system_sim_count}</div>
      `;
    },
  },
];

let currentRound = 0;
let currentIndex = 0;
let responses = { round1: [], round2: [], round3: [] };

function getItems() {
  return DATA[ROUNDS[currentRound].key];
}

function updateProgress() {
  const items = getItems();
  const total = items.length;
  const pct = total > 0 ? (currentIndex / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-count').textContent = `${currentIndex}/${total}`;
}

function updateTabs() {
  ROUNDS.forEach((r, i) => {
    const tab = document.getElementById('tab-' + i);
    tab.className = 'round-tab' +
      (i === currentRound ? ' active' : '') +
      (i < currentRound ? ' done' : '');
    if (i < currentRound) tab.innerHTML = r.title + '<span class="check"> ✓</span>';
    else tab.textContent = r.title;
  });
}

function renderCard() {
  const round = ROUNDS[currentRound];
  const items = getItems();

  if (currentIndex >= items.length) {
    nextRound();
    return;
  }

  const item = items[currentIndex];
  const buttons = round.buttons.map(b =>
    `<div class="btn" data-value="${b.value}" onclick="respond('${b.value}')">
      ${b.label}
      <span class="key-hint">${b.sub}<br/>press ${b.key}</span>
    </div>`
  ).join('');

  document.getElementById('card-area').innerHTML = `
    <div class="card">
      <div class="card-instruction">${round.instruction}</div>
      ${round.renderCard(item)}
    </div>
    <div class="button-row">${buttons}</div>
  `;

  updateProgress();
  updateTabs();
}

function showFlash(text, cls) {
  const el = document.getElementById('flash');
  el.textContent = text;
  el.className = 'flash show ' + cls;
  setTimeout(() => el.className = 'flash', 300);
}

function respond(value) {
  const round = ROUNDS[currentRound];
  const items = getItems();
  const item = items[currentIndex];
  const btn = round.buttons.find(b => b.value === value);

  responses[round.key].push({ ...item, response: value });
  showFlash(btn.flash, btn.flashClass);

  currentIndex++;
  renderCard();
}

function nextRound() {
  currentRound++;
  currentIndex = 0;

  if (currentRound >= ROUNDS.length) {
    showResults();
    return;
  }

  renderCard();
}

function showResults() {
  document.getElementById('card-area').style.display = 'none';

  // Round 1 analysis
  const r1 = responses.round1;
  const r1Counts = { insight: 0, useful: 0, noise: 0 };
  const r1ByType = {};
  r1.forEach(r => {
    r1Counts[r.response]++;
    const t = r.type || 'unknown';
    if (!r1ByType[t]) r1ByType[t] = { insight: 0, useful: 0, noise: 0, total: 0 };
    r1ByType[t][r.response]++;
    r1ByType[t].total++;
  });

  // Round 2 analysis
  const r2 = responses.round2;
  const r2Counts = { same: 0, related: 0, different: 0 };
  r2.forEach(r => r2Counts[r.response]++);

  // Check system accuracy
  const r2HighSim = r2.filter(r => r.score >= 0.5);
  const r2LowSim = r2.filter(r => r.score < 0.3 || r.score === 0);
  const highSimSame = r2HighSim.filter(r => r.response === 'same' || r.response === 'related').length;
  const lowSimDiff = r2LowSim.filter(r => r.response === 'different').length;

  // Round 3 analysis
  const r3 = responses.round3;
  const r3Counts = { high: 0, some: 0, none: 0 };
  r3.forEach(r => r3Counts[r.response]++);

  // Missed overlaps: user says overlap but system detected 0
  const r3Missed = r3.filter(r => (r.response === 'high' || r.response === 'some') && r.system_sim_count === 0);

  let typeRows = '';
  for (const [type, counts] of Object.entries(r1ByType).sort((a, b) => b[1].total - a[1].total)) {
    const noisePct = counts.total > 0 ? Math.round(counts.noise / counts.total * 100) : 0;
    typeRows += `<tr>
      <td>${type}</td>
      <td>${counts.insight}</td>
      <td>${counts.useful}</td>
      <td>${counts.noise}</td>
      <td>${noisePct}%</td>
    </tr>`;
  }

  let missedRows = r3Missed.map(r => `<tr>
    <td>${r.article_a}</td>
    <td>${r.article_b}</td>
    <td>${r.response}</td>
  </tr>`).join('');

  const el = document.getElementById('results');
  el.style.display = 'block';
  el.innerHTML = `
    <h2>Calibration Results</h2>

    <h3>Round 1 — Claim Quality</h3>
    <div class="stat-row">
      <div><div class="stat-number">${r1Counts.insight}</div><div class="stat-label">Insights</div></div>
      <div><div class="stat-number">${r1Counts.useful}</div><div class="stat-label">Useful facts</div></div>
      <div><div class="stat-number">${r1Counts.noise}</div><div class="stat-label">Noise</div></div>
    </div>
    <div class="insight-box">
      ${r1Counts.noise > r1Counts.insight
        ? 'More noise than insights — the pipeline is extracting too many product-specific facts.'
        : 'Reasonable signal-to-noise ratio.'}
      Noise rate: ${r1.length > 0 ? Math.round(r1Counts.noise / r1.length * 100) : 0}%
    </div>
    <table>
      <tr><th>Claim type</th><th>Insight</th><th>Useful</th><th>Noise</th><th>Noise %</th></tr>
      ${typeRows}
    </table>

    <h3>Round 2 — Similarity Detection</h3>
    <div class="stat-row">
      <div><div class="stat-number">${r2Counts.same}</div><div class="stat-label">Same insight</div></div>
      <div><div class="stat-number">${r2Counts.related}</div><div class="stat-label">Related</div></div>
      <div><div class="stat-number">${r2Counts.different}</div><div class="stat-label">Different</div></div>
    </div>
    <div class="insight-box">
      System accuracy on high-similarity pairs (≥0.5): ${r2HighSim.length > 0
        ? Math.round(highSimSame / r2HighSim.length * 100) + '% matched your judgment'
        : 'no high-sim pairs shown'}.<br>
      System accuracy on low/zero-similarity pairs: ${r2LowSim.length > 0
        ? Math.round(lowSimDiff / r2LowSim.length * 100) + '% correctly identified as different'
        : 'no low-sim pairs shown'}.<br>
      ${r2Counts.same + r2Counts.related > 0 && r2LowSim.filter(r => r.response !== 'different').length > 0
        ? `<strong>Missed connections:</strong> ${r2LowSim.filter(r => r.response !== 'different').length} pairs you consider same/related but system scored as unrelated.`
        : ''}
    </div>

    <h3>Round 3 — Article-Level Overlap</h3>
    <div class="stat-row">
      <div><div class="stat-number">${r3Counts.high}</div><div class="stat-label">Significant</div></div>
      <div><div class="stat-number">${r3Counts.some}</div><div class="stat-label">Shared themes</div></div>
      <div><div class="stat-number">${r3Counts.none}</div><div class="stat-label">No overlap</div></div>
    </div>
    ${r3Missed.length > 0 ? `
      <div class="insight-box">
        <strong>${r3Missed.length} article pair${r3Missed.length > 1 ? 's' : ''} where you see overlap but the system detected 0 similar claims.</strong>
        This confirms claim-level matching is too narrow — the overlap exists at a higher abstraction level.
      </div>
      <table>
        <tr><th>Article A</th><th>Article B</th><th>Your rating</th></tr>
        ${missedRows}
      </table>
    ` : ''}

    <h3>Raw Data</h3>
    <div class="json-output" onclick="navigator.clipboard.writeText(this.textContent)">${JSON.stringify(responses, null, 2)}</div>
    <div class="copy-hint">Click to copy JSON</div>
  `;
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (currentRound >= ROUNDS.length) return;
  const round = ROUNDS[currentRound];
  const btn = round.buttons.find(b => b.key === e.key);
  if (btn) {
    e.preventDefault();
    respond(btn.value);
  }
});

renderCard();
</script>
</body>
